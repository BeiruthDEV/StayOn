name: APK

# Gera o APK de release e anexa à release quando ela é publicada no GitHub.
# Em pull requests e no disparo manual (aba Actions), só compila e guarda o
# arquivo como artefato, para conferir que o build passa.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk StayOn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StayOn-apk
          path: apps/mobile/StayOn.apk

      - name: Publicar release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/StayOn.apk
