name: APK

# Gera o APK de release e publica no GitHub Releases quando uma tag v* é enviada.
# Também pode ser disparado à mão na aba Actions (só gera o arquivo, sem release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o projeto Android
        run: npx expo prebuild --platform android --no-install

      - name: Compilar o APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Renomear
        run: cp android/app/build/outputs/apk/release/app-release.apk StayOn.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StayOn-apk
          path: apps/mobile/StayOn.apk

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/StayOn.apk
          body: |
            Nova aba **Rotina**: semana fixa por dia da semana. Cada dia os blocos voltam desmarcados e o que foi cumprido fica no histórico, com o placar da semana.

            Instale por cima da versão anterior: os dados continuam no aparelho.
